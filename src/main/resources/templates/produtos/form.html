<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Produto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 mb-6">
        <div class="max-w-7xl mx-auto">
            <h1 class="text-2xl font-bold">AjudaAqui - Cadastro de Produto</h1>
        </div>
    </header>

    <main class="max-w-2xl mx-auto w-full px-6 bg-white p-8 rounded-lg shadow-md flex-grow">
        <h2 class="text-xl font-bold mb-6 text-gray-700"
            th:text="${produto.id == null ? 'Cadastrar Novo Produto' : 'Editar Produto'}"></h2>

        <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label class="block text-sm font-medium text-gray-700">Nome do Produto *</label>
                <input type="text" th:field="*{nome}" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500" />
                <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Descrição</label>
                <textarea th:field="*{descricao}" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500"></textarea>
                <p th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Preço (R$) *</label>
                <input type="number" step="0.01" th:field="*{precoAtual}" class="mt-1 block w-full border border-gray-300 rounded-md p-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="0.00"/>
                <p th:if="${#fields.hasErrors('precoAtual')}" th:errors="*{precoAtual}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t">
                <a href="/produtos" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">Cancelar</a>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Salvar Produto</button>
            </div>
        </form>
    </main>

    <footer class="bg-gray-200 text-center py-4 mt-8 border-t text-sm text-gray-600">
        DAW I - Trabalho Final - IFTM
    </footer>
</body>
</html>
