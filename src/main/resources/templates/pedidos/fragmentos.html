<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Fragmento de Sucesso Substituindo o Status -->
    <div th:fragment="status-finalizado" id="status-pedido-container">
        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800">
            CONCLUÍDO
        </span>
        <div class="text-green-600 mt-2 font-semibold">
            Pedido finalizado e estoque atualizado com sucesso!
        </div>
        <!-- Script para recarregar a página após 2 segundos e atualizar totais, se desejar -->
        <script> setTimeout(() => location.reload(), 2000); </script>
    </div>

    <!-- Fragmento de Erro (Regra de negócio violada) -->
    <div th:fragment="alerta-erro" id="mensagem-alerta" hx-swap-oob="true">
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline" th:text="${erro}">Erro genérico</span>
        </div>
    </div>

</body>
</html>
