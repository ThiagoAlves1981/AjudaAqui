<div th:fragment="tabela-pedidos" id="tabela-pedidos" xmlns:th="http://www.thymeleaf.org">
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="border-b bg-gray-50 text-gray-700">
                <th class="py-3 px-4"># ID</th>
                <th class="py-3 px-4">Cliente</th>
                <th class="py-3 px-4">Data/Hora</th>
                <th class="py-3 px-4">Status</th>
                <th class="py-3 px-4 text-center">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pedido : ${pedidos.content}" class="border-b hover:bg-gray-50">
                <td class="py-3 px-4 font-bold text-gray-700" th:text="${'#' + pedido.id}">#1</td>
                <td class="py-3 px-4 font-semibold text-gray-800" th:text="${pedido.clienteComprador.nome}">João Silva</td>
                <td class="py-3 px-4 text-gray-600" th:text="${#temporals.format(pedido.dataHoraPedido, 'dd/MM/yyyy HH:mm')}">24/10/2026 10:30</td>
                <td class="py-3 px-4">
                    <span th:text="${pedido.statusPedido}"
                          th:classappend="${pedido.statusPedido.name() == 'NOVO' ? 'bg-blue-100 text-blue-800' : 
                                           (pedido.statusPedido.name() == 'FINALIZADO' || pedido.statusPedido.name() == 'ENTREGUE' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800')}"
                          class="px-2.5 py-1 rounded-full text-xs font-semibold">
                        NOVO
                    </span>
                </td>
                <td class="py-3 px-4 text-center">
                    <a th:href="@{/pedidos/{id}(id=${pedido.id})}" 
                       class="inline-block bg-indigo-50 text-indigo-600 px-3 py-1 rounded border border-indigo-200 hover:bg-indigo-100 font-medium text-sm">
                        Ver Detalhes / Itens
                    </a>
                </td>
            </tr>
            <tr th:if="${pedidos.empty}">
                <td colspan="5" class="text-center py-6 text-gray-500">Nenhum pedido cadastrado.</td>
            </tr>
        </tbody>
    </table>

    <!-- Controles de Paginação -->
    <div class="flex justify-between items-center mt-4 text-sm text-gray-600" th:if="${pedidos.totalPages > 1}">
        <span th:text="'Página ' + (${pedidos.number} + 1) + ' de ' + ${pedidos.totalPages}"></span>
        <div class="space-x-1">
            <button th:if="${pedidos.hasPrevious()}"
                    th:hx-get="@{/pedidos(pagina=${pedidos.number - 1})}"
                    hx-target="#tabela-container"
                    class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Anterior</button>
            <button th:if="${pedidos.hasNext()}"
                    th:hx-get="@{/pedidos(pagina=${pedidos.number + 1})}"
                    hx-target="#tabela-container"
                    class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300">Próxima</button>
        </div>
    </div>
</div>
