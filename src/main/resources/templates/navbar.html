<header th:fragment="navbar" xmlns:th="http://www.thymeleaf.org" class="bg-indigo-600 text-white shadow-md mb-8">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <!-- Logo / Título do Sistema -->
        <a th:href="@{/produtos}" class="text-2xl font-bold tracking-wide flex items-center space-x-2">
            <span>🛠️ AjudaAqui</span>
        </a>

        <!-- Links de Navegação Entre Módulos -->
        <nav class="flex space-x-6 font-medium">
            <a th:href="@{/produtos}" 
               class="hover:text-indigo-200 transition-colors px-3 py-1 rounded-md"
               th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/produtos') ? 'bg-indigo-700 underline font-bold' : ''}">
                📦 Produtos
            </a>
            <a th:href="@{/clientes}" 
               class="hover:text-indigo-200 transition-colors px-3 py-1 rounded-md"
               th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/clientes') ? 'bg-indigo-700 underline font-bold' : ''}">
                👥 Clientes
            </a>
            <a th:href="@{/pedidos}" 
               class="hover:text-indigo-200 transition-colors px-3 py-1 rounded-md"
               th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI.startsWith('/pedidos') ? 'bg-indigo-700 underline font-bold' : ''}">
                🛒 Pedidos
            </a>
        </nav>
    </div>
</header>
