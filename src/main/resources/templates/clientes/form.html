<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Cliente - AjudaAqui</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800" 
            th:text="${cliente.id == null ? 'Novo Cliente' : 'Editar Cliente'}"></h1>

        <form th:action="@{/clientes/salvar}" th:object="${cliente}" method="post" class="space-y-4">
            <input type="hidden" th:field="*{id}" />

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nome:</label>
                <input type="text" th:field="*{nome}" 
                       class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">CPF:</label>
                <input type="text" th:field="*{cpf}" placeholder="123.456.789-00"
                       class="w-full border border-gray-300 px-3 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <p th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}" class="text-red-500 text-xs mt-1"></p>
            </div>

            <div class="flex justify-between items-center pt-4">
                <a th:href="@{/clientes}" class="text-gray-600 hover:underline">Cancelar</a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 font-medium">
                    Salvar
                </button>
            </div>
        </form>
    </div>
</body>
</html>
